name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Version from tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build web app
        env:
          LR_VERSION: ${{ env.VERSION }} # Settings › About shows it
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Test
        run: dotnet test LeagueRemote.sln -c Release -p:SkipWebBuild=true

      - name: Publish
        run: >
          dotnet publish src/LeagueRemote.Connector -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:Version=${{ env.VERSION }} -p:SkipWebBuild=true
          -o publish/connector

      # The exe is the whole app: settings live in %LOCALAPPDATA%\league-remote, licenses are served from inside it.
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item publish/connector/LeagueRemote.exe -Destination dist
          $hash = (Get-FileHash dist/LeagueRemote.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  LeagueRemote.exe" | Out-File -FilePath dist/SHA256SUMS.txt -Encoding ascii

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $flags = @()
          if ($env:VERSION -match '-') { $flags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME dist/LeagueRemote.exe dist/SHA256SUMS.txt --title $env:GITHUB_REF_NAME --generate-notes @flags
